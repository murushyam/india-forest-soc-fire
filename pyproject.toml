[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-soc-fire"
version = "1.0.0"
description = "Harmonised multi-depth SOC mapping and fire-impact modelling for Indian forest biomes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Muruganantham" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2023.6",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "quantile-forest>=1.3",
    "shap>=0.44",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.scripts]
india-soc-fire = "india_soc_fire.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
