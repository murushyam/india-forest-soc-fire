[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-soc-fire"
version = "0.0.1"
description = "Depth-harmonised SOC mapping for Indian forests linked to wildfire (pre-release scaffold)"
authors = [{name = "M.S. Shyam Sunder"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyyaml>=6"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "xgboost>=2.0", "quantile-forest>=1.3", "shap>=0.44"]
geo = ["geopandas>=0.14", "rasterio>=1.3", "shapely>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
